name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test and lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pytest "ruff==0.15.12"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Lint with ruff
        run: ruff check src tests

      - name: Check formatting with ruff
        run: ruff format --check src tests

      - name: Run unit tests
        run: pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: gitleaks (PR range)
        if: github.event_name == 'pull_request'
        run: |
          ./gitleaks detect --source . --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact -v

      - name: gitleaks (full history)
        if: github.event_name == 'push'
        run: ./gitleaks detect --source . --log-opts="--all" --redact -v

  gate:
    name: CI gate
    if: always()
    needs: [python, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Require python checks and secret scan
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          set -euo pipefail
          test "$PYTHON_RESULT" = success
          test "$SECRETS_RESULT" = success
